# ~/.config/yazi/keymap.toml
#
# One binding only. Everything else you press in yazi is yazi's own, so
# what you learn here works on any machine with yazi on it.
#
# To start Claude Code or a shell in the folder you are browsing: press q.
# yazi quits and your shell lands in that folder (see the `y` function).

# Enter -- cd into a directory, or open a file.
# yazi's own <Enter> is `open`, which does not enter directories; this adds
# that case and leaves files alone. `l` / <Right> still enter a directory.
[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter dir or open file"
