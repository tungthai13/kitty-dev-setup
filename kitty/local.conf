# ~/.config/kitty/local.conf
# Dev workspace: yazi + claude + micro. Included from kitty.conf.
#
# Design rule: no NEW keys. The two `map` lines below rebind kitty's own
# keys to kitty's own alternative actions -- the keys you press are still
# kitty's, they just inherit the current directory. Nothing else is bound.

#: --- Editor -------------------------------------------------------
# Also what kitty_mod+p>n uses to open a file:line from the screen.
editor micro

#: --- Layouts ------------------------------------------------------
# splits = panes side by side; stack = one pane full screen.
# kitty_mod+l cycles between them, which is how you zoom a pane.
enabled_layouts splits,stack
inactive_text_alpha 0.85

#: --- Remote control -------------------------------------------------
# Nothing in this repo uses it any more. Kept on so `kitten @` is there if
# you want to script kitty yourself. Changing it needs a full restart.
allow_remote_control socket-only
listen_on unix:@kitty-dev

#: --- New panes and tabs open where you already are --------------------
# kitty's new_window/new_tab open in the directory kitty was STARTED in,
# not the one you are in -- so a new pane lands at ~ however deep in a
# project you were. Verified: cd to /usr/share/doc, kitty_mod+enter, and
# the new pane reports /tmp. The *_with_cwd variants are kitty's own
# actions for exactly this; same keys, VS Code behaviour.
map kitty_mod+enter new_window_with_cwd
map kitty_mod+t     new_tab_with_cwd

#: --- Everything else about panes is kitty's own key, unchanged --------
#   kitty_mod+] / [   focus the next / previous pane
#   kitty_mod+f / b   move this pane forward / back
#   kitty_mod+w       close this pane
#   kitty_mod+r       resize -- arrows, then Enter
#   kitty_mod+l       cycle layout (zoom a pane full screen and back)
#   kitty_mod+p>n     open a file:42 from the screen, in micro

#: --- Quality of life -------------------------------------------------------
# copy_on_select and strip_trailing_spaces live in kitty.conf already.
scrollback_lines 20000
confirm_os_window_close 1
window_padding_width 2
tab_bar_style powerline
tab_bar_edge top

#: --- Tabs ---------------------------------------------------------------
tab_title_template "{index}: {title}"
active_tab_font_style bold
