# ~/.config/kitty/local.conf
# Dev workspace: yazi + claude + micro. Included from kitty.conf.
#
# Design rule: this file only binds keys kitty leaves FREE.
# Every kitty default (tabs, font size, scrollback, layouts) still works.
# Free kitty_mod keys used here: \ ' m p   (no kitty_mod+alt+* -- too hard)

#: --- Editor -------------------------------------------------------
editor micro

#: --- Layouts ------------------------------------------------------
enabled_layouts splits,stack
inactive_text_alpha 0.85

#: --- Remote control (needed by kdev / kitten @) --------------------
allow_remote_control socket-only
listen_on unix:@ssi-kitty

#: --- Splits: create -------------------------------------------------
# kitty_mod+enter (new_window) already splits in the `splits` layout;
# these two just let you pick the direction. tmux-style: \ and '
map kitty_mod+backslash   launch --location=vsplit --cwd=current
map kitty_mod+apostrophe  launch --location=hsplit --cwd=current

#: --- Splits: move between them, move them around ----------------------
# Nothing bound here on purpose. kitty's own keys already do it, and
# three-modifier chords were too hard to remember on a new machine:
#   kitty_mod+] / [   focus the next / previous pane
#   kitty_mod+f / b   move this pane forward / back in the layout
#   kitty_mod+r       resize (arrows, then Enter)
# Adding a workspace pane is the `kpane` command, or `dev` -> Add a ... pane.

#: --- Zoom one pane ------------------------------------------------------
# Resizing is kitty's own kitty_mod+r (interactive mode, arrows then Enter).
map kitty_mod+m toggle_layout stack

#: --- Hints: the VS Code "ctrl+click a path" replacement -------------------
# Nothing bound here either. kitty_mod+p is kitty's OWN chord prefix with
# nine sub-keys; p>n already opens filename:linenum in the `editor` set
# above, so `editor micro` is all this config needs to contribute.
#   p>n  open file:42 in micro      p>f  paste a path into the terminal
#   p>l  paste a whole line         p>w  paste a word
#   p>h  paste a git hash           p>y  open a hyperlink

#: --- Quality of life -------------------------------------------------------
scrollback_lines 20000
copy_on_select clipboard
strip_trailing_spaces smart
confirm_os_window_close 1
window_padding_width 2
tab_bar_style powerline
tab_bar_edge top

#: --- Tabs: one per project ---------------------------------------------
# kdev sets an explicit tab title (the project folder name); keep it.
tab_title_template "{index}: {title}"
active_tab_font_style bold
