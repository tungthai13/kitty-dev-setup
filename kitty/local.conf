# ~/.config/kitty/local.conf
# Dev workspace: yazi + claude + micro. Included from kitty.conf.
#
# Design rule: this file only binds keys kitty leaves FREE.
# Every kitty default (tabs, font size, scrollback, layouts) still works.
# Free kitty_mod keys used here: \ ' m p   (plus kitty_mod+alt+*)

#: --- Editor -------------------------------------------------------
editor micro

#: --- Layouts ------------------------------------------------------
enabled_layouts splits,stack
inactive_text_alpha 0.85

#: --- Remote control (needed by kdev / kitten @) --------------------
allow_remote_control socket-only
listen_on unix:@ssi-kitty

#: --- Splits: create -------------------------------------------------
# kitty_mod+enter (new_window) already splits in the `splits` layout;
# these two just let you pick the direction. tmux-style: \ and '
map kitty_mod+backslash   launch --location=vsplit --cwd=current
map kitty_mod+apostrophe  launch --location=hsplit --cwd=current

#: --- Splits: add ONE workspace pane -----------------------------------
# The grow-on-demand half of `kdev`: start with one pane and add the parts
# you actually need. Each lands in the slot kdev would use, so the layout
# ends up the same whatever order you press them in.
# `map ... launch` runs inside kitty, so unlike `kpane` these still work
# when remote control is off (and over SSH -- but the pane is LOCAL).
map kitty_mod+alt+f launch --location=before --bias 30 --cwd=current --window-title files yazi
map kitty_mod+alt+s launch --location=hsplit --bias 30 --cwd=current --window-title shell
map kitty_mod+alt+c launch --location=vsplit --bias 70 --cwd=current --window-title claude claude

#: --- Splits: focus a neighbour ---------------------------------------
map kitty_mod+alt+h neighboring_window left
map kitty_mod+alt+j neighboring_window down
map kitty_mod+alt+k neighboring_window up
map kitty_mod+alt+l neighboring_window right

#: --- Splits: move the pane itself -------------------------------------
map kitty_mod+alt+left  move_window left
map kitty_mod+alt+down  move_window down
map kitty_mod+alt+up    move_window up
map kitty_mod+alt+right move_window right

#: --- Zoom one pane ------------------------------------------------------
# Resizing is kitty's own kitty_mod+r (interactive mode, arrows then Enter).
map kitty_mod+m toggle_layout stack

#: --- Hints: the VS Code "ctrl+click a path" replacement -------------------
# Claude Code prints app/api/main.py:42 -- kitty_mod+p then n opens it.
map kitty_mod+p>n kitten hints --type linenum micro +{line} {path}
map kitty_mod+p>f kitten hints --type path --program @
map kitty_mod+p>shift+f kitten hints --type path --program -
map kitty_mod+p>l kitten hints --type line --program @
map kitty_mod+p>w kitten hints --type word --program @

#: --- Quality of life -------------------------------------------------------
scrollback_lines 20000
copy_on_select clipboard
strip_trailing_spaces smart
confirm_os_window_close 1
window_padding_width 2
tab_bar_style powerline
tab_bar_edge top

#: --- Tabs: one per project ---------------------------------------------
# kdev sets an explicit tab title (the project folder name); keep it.
tab_title_template "{index}: {title}"
active_tab_font_style bold
