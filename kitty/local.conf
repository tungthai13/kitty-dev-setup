# ~/.config/kitty/local.conf
# Dev workspace: yazi + claude + micro. Included from kitty.conf.
# kitty_mod is ctrl+shift unless overridden.

#: --- Editor -------------------------------------------------------
editor micro

#: --- Layouts ------------------------------------------------------
enabled_layouts splits,stack
inactive_text_alpha 0.85

#: --- Remote control (needed by kdev / kitten @) --------------------
allow_remote_control socket-only
listen_on unix:@ssi-kitty

#: --- Splits: create ------------------------------------------------
map kitty_mod+enter  launch --location=vsplit --cwd=current
map kitty_mod+\      launch --location=vsplit --cwd=current
map kitty_mod+minus  launch --location=hsplit --cwd=current

#: --- Splits: navigate (vim keys) -----------------------------------
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right

#: --- Splits: move / resize ------------------------------------------
map kitty_mod+alt+h move_window left
map kitty_mod+alt+j move_window down
map kitty_mod+alt+k move_window up
map kitty_mod+alt+l move_window right
map kitty_mod+left  resize_window narrower 4
map kitty_mod+right resize_window wider 4
map kitty_mod+up    resize_window taller 2
map kitty_mod+down  resize_window shorter 2
map kitty_mod+home  resize_window reset

#: --- Zoom one pane (VS Code's ctrl+shift+e maximize) -----------------
map kitty_mod+z toggle_layout stack

#: --- Hints: the VS Code "ctrl+click a path" replacement ---------------
# Claude Code prints app/api/main.py:42 -- these open it in micro.
map kitty_mod+p>n kitten hints --type linenum --linenum-action=self micro +{line} {path}
map kitty_mod+p>f kitten hints --type path --program @
map kitty_mod+p>shift+f kitten hints --type path --program -
map kitty_mod+p>l kitten hints --type line --program @
map kitty_mod+p>w kitten hints --type word --program @
map kitty_mod+e open_url_with_hints

#: --- Scrollback into micro (read a long Claude answer comfortably) ----
map kitty_mod+g show_scrollback

#: --- Quality of life ---------------------------------------------------
scrollback_lines 20000
copy_on_select clipboard
strip_trailing_spaces smart
confirm_os_window_close 1
window_padding_width 2
tab_bar_style powerline
tab_bar_edge top
